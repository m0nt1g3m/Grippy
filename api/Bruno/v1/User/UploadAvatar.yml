info:
  name: UploadAvatar
  type: http
  seq: 3

http:
  method: POST
  url: "{{address}}/api/v1/user/avatar"
  body:
    type: multipart-form
    data:
      - name: avatar
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
