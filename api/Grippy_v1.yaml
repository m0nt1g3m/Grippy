components:
  schemas:
    addtodo:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
      example:
        title: First todo
        content: Content of first todo
    updatetodo:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        is_completed:
          type: boolean
      example:
        title: First todo
        content: Content of first todo
        is_completed: true
    updateprofile:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
      example:
        email: '{{email}}'
        username: m0nt1g3m_2
    uploadavatar:
      type: object
      properties:
        avatar:
          type: object
          properties:
            type:
              type: string
    signin:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: '{{email}}'
        password: '{{password}}'
    signup:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
        password:
          type: string
      example:
        email: developer.m0nt1g3m@gmail.com
        username: m0nt1g3m
        password: '123456789'
  requestBodies:
    addtodo:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/addtodo'
      description: ''
      required: true
    updatetodo:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updatetodo'
      description: ''
      required: true
    updateprofile:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateprofile'
      description: ''
      required: true
    uploadavatar:
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/uploadavatar'
      description: ''
      required: true
    signin:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/signin'
      description: ''
      required: true
    signup:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/signup'
      description: ''
      required: true
  securitySchemes:
    deletetodo:
      type: http
      scheme: bearer
    addtodo:
      type: http
      scheme: bearer
    updatetodo:
      type: http
      scheme: bearer
    gettodo:
      type: http
      scheme: bearer
    getprofile:
      type: http
      scheme: bearer
    updateprofile:
      type: http
      scheme: bearer
    uploadavatar:
      type: http
      scheme: bearer
