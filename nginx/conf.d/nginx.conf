resolver 127.0.0.11 valid=10s ipv6=off; # Docker embedded DNS

server {
    listen 80;
    server_name grippy.work.gd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grippy.work.gd;

    ssl_certificate     /etc/letsencrypt/live/grippy.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grippy.work.gd/privkey.pem;

    location / {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}