version: '3'

vars:
  MIGRATIONS_PATH: './migrations'
  COMPOSE: docker compose --env-file .env.prod
  DOMAIN: grippy.work.gd
  EMAIL: developer.m0nt1g3m@gmail.com
  CERTBOT_DIR: ./certbot
  STAGING_FLAG: ""

tasks:
  create_migration:
    desc: "Create a new migration file (Usage: task create_migration -- name)"
    cmds:
      - mkdir -p {{.MIGRATIONS_PATH}}
      - migrate create -ext=sql -dir={{.MIGRATIONS_PATH}} -seq {{.CLI_ARGS}}

  dev_migrate_up:
    desc: "Run all pending migrations or N steps for development"
    dotenv: ['.env.dev']
    cmds:
      - mkdir -p {{.MIGRATIONS_PATH}}
      - migrate -path={{.MIGRATIONS_PATH}} -database "postgres://$DEV_POSTGRES_USER:$DEV_POSTGRES_PASSWORD@$DEV_POSTGRES_HOST:$DEV_POSTGRES_PORT/$DEV_POSTGRES_DB?sslmode=disable" -verbose up {{.CLI_ARGS}}

  dev_migrate_down:
    desc: "Rollback migrations down N steps for development"
    dotenv: ['.env.dev']
    cmds:
      - migrate -path={{.MIGRATIONS_PATH}} -database "postgres://$DEV_POSTGRES_USER:$DEV_POSTGRES_PASSWORD@$DEV_POSTGRES_HOST:$DEV_POSTGRES_PORT/$DEV_POSTGRES_DB?sslmode=disable" -verbose down {{.CLI_ARGS}}

  dev_force_migrate_down:
    desc: "Force migration version for development"
    dotenv: ['.env.dev']
    cmds:
      - migrate -path={{.MIGRATIONS_PATH}} -database "postgres://$DEV_POSTGRES_USER:$DEV_POSTGRES_PASSWORD@$DEV_POSTGRES_HOST:$DEV_POSTGRES_PORT/$DEV_POSTGRES_DB?sslmode=disable" force 1

  prod_migrate_up:
    desc: "Apply pending migrations to the prod database"
    cmds:
      - '{{.COMPOSE}} run --rm migrate -path=/migrations -database "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?sslmode=disable" up {{.CLI_ARGS}}'

  prod_migrate_down:
    desc: "Rollback prod migrations down N steps"
    cmds:
      - '{{.COMPOSE}} run --rm migrate -path=/migrations -database "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?sslmode=disable" down {{.CLI_ARGS}}'

    prod_init_ssl:
    desc: "Obtain Let's Encrypt certificate automatically (idempotent, no manual nginx swaps)"
    status:
      - test -f {{.CERTBOT_DIR}}/conf/renewal/{{.DOMAIN}}.conf
    cmds:
      - mkdir -p {{.CERTBOT_DIR}}/conf {{.CERTBOT_DIR}}/www

      - echo "### [1/6] Creating dummy self-signed cert so nginx can start..."
      - |
        {{.COMPOSE}} run --rm --entrypoint sh certbot -c "
          mkdir -p /etc/letsencrypt/live/{{.DOMAIN}} && \
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/{{.DOMAIN}}/privkey.pem \
            -out    /etc/letsencrypt/live/{{.DOMAIN}}/fullchain.pem \
            -subj '/CN={{.DOMAIN}}'"

      - echo "### [2/6] Starting nginx with dummy cert..."
      - '{{.COMPOSE}} up -d --force-recreate --no-deps nginx'

      - echo "### [3/6] Waiting for nginx to listen on :80..."
      - |
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null http://127.0.0.1/ 2>/dev/null; then
            echo "nginx is up after ${i}s"
            break
          fi
          sleep 1
        done
        curl -sf -o /dev/null http://127.0.0.1/ || {
          echo "!!! nginx did not become reachable on :80"
          {{.COMPOSE}} logs --tail=50 nginx
          exit 1
        }

      - echo "### [4/6] Removing dummy cert files (nginx keeps cert in memory)..."
      - |
        {{.COMPOSE}} run --rm --entrypoint sh certbot -c "
          rm -rf /etc/letsencrypt/live/{{.DOMAIN}} \
                 /etc/letsencrypt/archive/{{.DOMAIN}} \
                 /etc/letsencrypt/renewal/{{.DOMAIN}}.conf"

      - echo "### [5/6] Requesting Let's Encrypt certificate..."
      - |
        if ! {{.COMPOSE}} run --rm --entrypoint certbot certbot certonly \
              --webroot -w /var/www/certbot \
              {{.STAGING_FLAG}} \
              --email {{.EMAIL}} \
              -d {{.DOMAIN}} \
              --rsa-key-size 4096 \
              --agree-tos \
              --no-eff-email \
              --non-interactive; then
          echo "!!! Certbot failed — restoring dummy cert so nginx stays startable"
          {{.COMPOSE}} run --rm --entrypoint sh certbot -c "
            mkdir -p /etc/letsencrypt/live/{{.DOMAIN}} && \
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout /etc/letsencrypt/live/{{.DOMAIN}}/privkey.pem \
              -out    /etc/letsencrypt/live/{{.DOMAIN}}/fullchain.pem \
              -subj '/CN={{.DOMAIN}}'"
          exit 1
        fi

      - echo "### [6/6] Reloading nginx with the real certificate..."
      - '{{.COMPOSE}} exec nginx nginx -s reload'

      - echo "### Done. Certificate issued for {{.DOMAIN}}."

  prod_deploy:
    desc: "Full deployment"
    cmds:
      - task: prod_init_ssl
      - '{{.COMPOSE}} up -d --build'

  prod_up:
    desc: "Build and start the prod stack"
    cmds:
      - '{{.COMPOSE}} up -d --build'

  prod_down:
    desc: "Stop the prod stack"
    cmds:
      - '{{.COMPOSE}} down'

  prod_ps:
    desc: "Show prod containers"
    cmds:
      - '{{.COMPOSE}} ps'

  prod_logs:
    desc: "Follow prod logs: task prod_logs -- backend"
    cmds:
      - '{{.COMPOSE}} logs -f {{.CLI_ARGS}}'
