version: '3'

vars:
  COMPOSE_EDGE: >-
    docker compose
    -f docker-compose.yml
    -f docker-compose.edge.yml
    --env-file .env.prod
  COMPOSE_STANDALONE: >-
    docker compose
    -f docker-compose.yml
    -f docker-compose.standalone.yml
    --env-file .env.prod
  MIGRATIONS_PATH: ./migrations
  DOMAIN: grippy.work.gd
  EMAIL: developer.m0nt1g3m@gmail.com
  STAGING_FLAG: ""

tasks:
  edge_deploy:
    desc: Deploy behind EdgeProxy (nginx+certbot live in /opt/EdgeProxy)
    cmds:
      - '{{.COMPOSE_EDGE}} up -d --build --remove-orphans'
      - echo "Now add grippy.work.gd in /opt/EdgeProxy: task add-domain"

  edge_down:
    desc: Stop Grippy (edge mode)
    cmds:
      - '{{.COMPOSE_EDGE}} down'

  edge_ps:
    cmds:
      - '{{.COMPOSE_EDGE}} ps'

  edge_logs:
    desc: "Follow logs: task edge_logs -- backend"
    cmds:
      - '{{.COMPOSE_EDGE}} logs -f {{.CLI_ARGS}}'

  edge_exec:
    desc: "Exec in a service: task edge_exec -- backend sh"
    cmds:
      - '{{.COMPOSE_EDGE}} exec {{.CLI_ARGS}}'

  standalone_deploy:
    desc: Deploy standalone (own nginx + certbot)
    cmds:
      - task: standalone_init_ssl
      - '{{.COMPOSE_STANDALONE}} up -d --build --remove-orphans'

  standalone_down:
    cmds:
      - '{{.COMPOSE_STANDALONE}} down'

  standalone_ps:
    cmds:
      - '{{.COMPOSE_STANDALONE}} ps'

  standalone_logs:
    desc: "Follow logs: task standalone_logs -- nginx"
    cmds:
      - '{{.COMPOSE_STANDALONE}} logs -f {{.CLI_ARGS}}'

  standalone_init_ssl:
    desc: Bootstrap SSL for standalone mode (dummy cert -> issue -> reload)
    status:
      - test -f certbot/conf/renewal/{{.DOMAIN}}.conf
    cmds:
      - mkdir -p certbot/conf certbot/www
      - echo "### [1/5] Dummy cert..."
      - |
        {{.COMPOSE_STANDALONE}} run --rm --entrypoint sh certbot -c "
          mkdir -p /etc/letsencrypt/live/{{.DOMAIN}} && \
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/{{.DOMAIN}}/privkey.pem \
            -out    /etc/letsencrypt/live/{{.DOMAIN}}/fullchain.pem \
            -subj '/CN={{.DOMAIN}}' 2>/dev/null"
      - echo "### [2/5] Starting nginx with dummy..."
      - '{{.COMPOSE_STANDALONE}} up -d --force-recreate nginx'
      - echo "### [3/5] Waiting for :80..."
      - |
        for i in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1/ || echo 000)
          [ "$code" != "000" ] && { echo "nginx up (HTTP $code)"; break; }
          sleep 1
        done
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1/ || echo 000)
        [ "$code" != "000" ] || { echo "!!! nginx not on :80"; {{.COMPOSE_STANDALONE}} logs --tail=50 nginx; exit 1; }
      - echo "### [4/5] Issuing real certificate..."
      - |
        {{.COMPOSE_STANDALONE}} run --rm --entrypoint sh certbot -c "
          rm -rf /etc/letsencrypt/live/{{.DOMAIN}} \
                 /etc/letsencrypt/archive/{{.DOMAIN}} \
                 /etc/letsencrypt/renewal/{{.DOMAIN}}.conf"
      - |
        if ! {{.COMPOSE_STANDALONE}} run --rm --entrypoint certbot certbot certonly \
              --webroot -w /var/www/certbot \
              {{.STAGING_FLAG}} \
              --email {{.EMAIL}} -d {{.DOMAIN}} \
              --rsa-key-size 4096 --agree-tos --no-eff-email --non-interactive; then
          echo "!!! certbot failed — restoring dummy so nginx stays startable"
          {{.COMPOSE_STANDALONE}} run --rm --entrypoint sh certbot -c "
            mkdir -p /etc/letsencrypt/live/{{.DOMAIN}} && \
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout /etc/letsencrypt/live/{{.DOMAIN}}/privkey.pem \
              -out    /etc/letsencrypt/live/{{.DOMAIN}}/fullchain.pem \
              -subj '/CN={{.DOMAIN}}'"
          exit 1
        fi
      - echo "### [5/5] Reloading nginx..."
      - '{{.COMPOSE_STANDALONE}} exec nginx nginx -s reload'

  create_migration:
    desc: "task create_migration -- name"
    cmds:
      - mkdir -p {{.MIGRATIONS_PATH}}
      - migrate create -ext=sql -dir={{.MIGRATIONS_PATH}} -seq {{.CLI_ARGS}}

  switch_to_edge:
    desc: Switch from standalone to edge mode (removes nginx, certbot)
    cmds:
      - '{{.COMPOSE_STANDALONE}} down --remove-orphans'
      - task: edge_deploy

  switch_to_standalone:
    desc: Switch from edge to standalone mode (adds nginx, certbot)
    cmds:
      - '{{.COMPOSE_EDGE}} down --remove-orphans'
      - task: standalone_deploy