name: grippy

services:
  postgres:
    image: postgres:17-alpine
    container_name: grippy_postgres
    restart: always
    env_file: [.env.prod]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    container_name: grippy_redis
    restart: always
    env_file: [.env.prod]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: grippy_migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  backend:
    build: .
    container_name: grippy_backend
    restart: always
    env_file: [.env.prod]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
    networks: [app]

networks:
  app:

volumes:
  pgdata:
  redisdata: